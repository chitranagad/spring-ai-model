spring:
  application:
    name: spring-ai-model
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:1b
    chat:
      client:
        enabled: false

server:
  port: 9292